# ==============================================================================
# Robot Localization Dual-EKF + NavSat Configuration
# Target: Autonomous Grocery & Food Delivery Robot (IIT Mandi Campus)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. LOCAL EKF FILTER (Odom Frame)
# Publishes: odom -> base_footprint dynamic transform
# Fuses: Wheel Odometry + IMU angular rate & linear acceleration
# Continuous, smooth short-term motion estimation without discrete GPS jumps.
# ------------------------------------------------------------------------------
ekf_filter_node_odom:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.05
    print_diagnostics: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    publish_tf: true
    publish_acceleration: false

    # Wheel Odometry input
    odom0: /wheel/odometry
    # Matrix: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # IMU input
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  true,  false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

# ------------------------------------------------------------------------------
# 2. GLOBAL EKF FILTER (Map Frame)
# Publishes: map -> odom dynamic transform
# Fuses: Wheel Odometry + IMU Yaw + Transformed GPS (/odometry/gps)
# Corrects accumulated odometry drift across campus road networks.
# ------------------------------------------------------------------------------
ekf_filter_node_map:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.05
    print_diagnostics: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    publish_tf: true
    publish_acceleration: false

    # Wheel Odometry input
    odom0: /wheel/odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # GPS Odometry input (generated by navsat_transform_node)
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_differential: false
    odom1_relative: false

    # IMU input (Absolute heading)
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

# ------------------------------------------------------------------------------
# 3. NAVSAT TRANSFORM NODE
# Converts GPS (NavSatFix) + IMU into Cartesian coordinates (/odometry/gps)
# ------------------------------------------------------------------------------
navsat_transform:
  ros__parameters:
    frequency: 20.0
    delay: 3.0
    magnetic_declination_radians: 0.0150   # Mandi, HP (~0.86 deg East)
    yaw_offset: 0.0                        # IMU reading when facing East
    zero_altitude: true                    # Campus 2D pathway assumption
    broadcast_cartesian_transform: false
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: true
    # Reference Datum: IIT Mandi Campus (Kamand / North Campus)
    # [Latitude, Longitude, Heading (rad), Map Frame, Base Link Frame]
    datum: [31.7815, 76.9943, 0.0, map, base_footprint]
